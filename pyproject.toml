[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wormhole-lab"
version = "0.1.0"
description = "A rigorous exposition and computed exploration of the Morris-Thorne traversable wormhole: the real general-relativistic metric, the derived stress-energy, and the actual open problem it implies"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "David Lindgreen" }]
keywords = ["wormhole", "general-relativity", "morris-thorne", "exotic-matter", "energy-conditions", "theoretical-physics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.26,<2.3", "scipy>=1.11,<2"]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.13,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
wormhole-lab = "wormhole_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wormhole_lab"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=wormhole_lab --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["wormhole_lab"]

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
